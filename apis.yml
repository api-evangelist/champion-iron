aid: champion-iron

name: Champion Iron

description: 'Champion Iron Limited (TSX: CIA, ASX: CIA, OTCQX: CIAFF) is a high-purity iron ore producer with operations
  in Canada and Norway. Through its subsidiary Quebec Iron Ore Inc. it owns and operates the Bloom Lake Mining Complex near
  Fermont, Québec, an open-pit operation with two concentration plants (15M wmt/yr nameplate capacity) that produces low-contaminant,
  direct-reduction-grade iron ore concentrate shipped by rail to Sept-Îles. It also operates Rana Gruber in Mo i Rana, Norway,
  and holds growth projects including Kamistiatusset (Kami) in Newfoundland and Labrador. Head office is in Rozelle, NSW,
  Australia, with Canadian offices in Montréal, Toronto and Québec City. The company publishes no public API, developer portal
  or API documentation.'

